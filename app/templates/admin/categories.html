{% extends "base.html" %}{% block title %}Categories · {{ business_name }}{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">MENU STRUCTURE</p><h1>Categories</h1></div></div><section class="form-card"><h2>Add category</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" maxlength="80" required></label><label>Description<textarea name="description"></textarea></label><button class="btn primary">Add category</button></form></section><section class="panel"><div class="list-stack">{% for c in categories %}<div class="list-row"><div><strong>{{ c.name }}</strong><small>{{ c.description or '' }}</small></div><span class="status {{ 'available' if c.is_active else 'cancelled' }}">{{ 'Active' if c.is_active else 'Inactive' }}</span></div>{% endfor %}</div></section>{% endblock %}
