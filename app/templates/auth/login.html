{% extends "base.html" %}{% block title %}Login · {{ business_name }}{% endblock %}
{% block content %}<div class="auth-layout"><section class="auth-aside"><p class="eyebrow">WELCOME BACK</p><h1>Good to see you.</h1><p>Sign in to track orders, manage bookings and enjoy a smoother visit.</p></section><section class="form-card"><h2>Sign in</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><label class="check"><input type="checkbox" name="remember"> Keep me signed in</label><button class="btn primary full">Login</button></form><p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></section></div>{% endblock %}
