{% extends "base.html" %}{% block title %}Register · {{ business_name }}{% endblock %}
{% block content %}<div class="auth-layout"><section class="auth-aside"><p class="eyebrow">JOIN US</p><h1>Your next favourite is waiting.</h1><p>Create an account to order online and manage room reservations.</p></section><section class="form-card"><h2>Create account</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="full_name" maxlength="120" required autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Phone (optional)<input name="phone" autocomplete="tel"></label><label>Password <small>At least 10 characters</small><input type="password" name="password" minlength="10" required autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm_password" minlength="10" required autocomplete="new-password"></label><button class="btn primary full">Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></section></div>{% endblock %}
