{% extends "base.html" %}{% block title %}Book a room · {{ business_name }}{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">RESERVATIONS</p><h1>Book a room</h1><p>Select your room and booking period.</p></div></div><div class="panel"><form method="post" class="booking-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Room<select name="room_id" required>{% for r in rooms %}<option value="{{ r.id }}">Room {{ r.room_number }} — {{ r.room_type }} ({{ currency }} {{ '%.2f'|format(r.hourly_rate_cents/100) }}/hour)</option>{% endfor %}</select></label><label>Check-in<input type="datetime-local" name="check_in_at" required></label><label>Check-out<input type="datetime-local" name="check_out_at" required></label><label>Rate type<select name="booking_unit"><option value="hour">Hourly</option><option value="day">Daily</option><option value="week">Weekly</option></select></label><button class="btn primary">Check & confirm booking</button></form></div>{% endblock %}
