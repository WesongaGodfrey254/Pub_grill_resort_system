{% extends "base.html" %}{% block title %}Cart · {{ business_name }}{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">ALMOST THERE</p><h1>Your cart</h1><p>Review your order before sending it to our team.</p></div></div><div class="panel"><div id="cartItems"></div><div id="cartEmpty" class="empty-state">Your cart is empty. <a href="{{ url_for('orders.menu') }}">Browse the menu</a>.</div><div id="cartCheckout" hidden><div class="cart-summary"><label>Order type<select id="orderType"><option value="takeaway">Takeaway</option><option value="dine_in">Dine-in</option><option value="delivery">Delivery (staff confirmation may be required)</option></select></label><label>Special instructions<textarea id="instructions" rows="2" maxlength="500" placeholder="Allergies or preparation notes"></textarea></label><div class="total-row"><span>Estimated total</span><strong id="cartTotal"></strong></div><button id="placeOrder" class="btn primary">Place order</button><p class="muted">Final price and stock are verified by the server.</p></div></div></div><script>window.CART_ENDPOINT="{{ url_for('orders.create_order') }}";window.CSRF_TOKEN="{{ csrf_token() }}";</script><script src="{{ url_for('static', filename='js/cart.js') }}" defer></script>{% endblock %}
